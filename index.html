<!DOCTYPE html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Sito offline - Dominio in vendita</title>
    <style>
      :root {
        color-scheme: dark;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        font-family: Arial, sans-serif;
        background: #0f172a;
        color: #e2e8f0;
        padding: 2rem;
      }

      main {
        max-width: 640px;
        width: 100%;
        background: rgba(15, 23, 42, 0.75);
        border: 1px solid rgba(148, 163, 184, 0.3);
        border-radius: 14px;
        padding: 2rem;
        text-align: center;
      }

      h1 {
        margin-top: 0;
        margin-bottom: 0.75rem;
        font-size: 1.75rem;
      }

      p {
        margin: 0.5rem 0;
        line-height: 1.5;
      }

      .powered {
        margin-top: 2rem;
      }

      .powered a {
        display: inline-flex;
        align-items: center;
        color: inherit;
        text-decoration: none;
      }

      .powered img {
        height: 72px;
        width: auto;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Offline</h1>
      <p>Domain on sale</p>
      <p class="powered">
        <a href="https://www.sabiasrl.com" target="_blank" rel="noopener noreferrer">
          <img src="assets/powered-by.png" alt="Sabia Srl" loading="lazy" decoding="async" />
        </a>
      </p>
    </main>
  </body>
</html>
